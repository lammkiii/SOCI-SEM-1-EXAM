<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社會學導論 x 吉伊卡哇特訓班</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        /* 吉伊卡哇風格 CSS */
        @import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap');

        :root {
            --primary: #ffcbda; --secondary: #aaddff; --accent: #fffacd;
            --text: #5a4d4d; --bg: #fffbf0; --error: #ff6b6b;
        }

        body {
            font-family: 'Kosugi Maru', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle, #ffe4e1 2px, transparent 2.5px);
            background-size: 30px 30px;
            color: var(--text);
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%; max-width: 600px;
            background: white; border-radius: 30px;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4);
            padding: 30px; text-align: center;
            border: 5px solid white; outline: 5px dashed var(--primary);
            position: relative; overflow-y: auto; max-height: 90vh;
        }

        h1 { color: var(--primary); text-shadow: 2px 2px 0px var(--text); font-size: 2.5em; margin-bottom: 20px; }
        .btn {
            background-color: var(--secondary); color: white; border: none;
            padding: 12px 25px; font-size: 1.2em; border-radius: 50px;
            cursor: pointer; margin: 10px; width: 80%; max-width: 300px;
            box-shadow: 0 5px 0 #77aadd; transition: transform 0.1s;
        }
        .btn:active { transform: translateY(5px); box-shadow: none; }
        .btn-start { background-color: var(--primary); box-shadow: 0 5px 0 #ff99bb; }
        .btn-note { background-color: #ffd700; color: #8B4513; box-shadow: 0 5px 0 #daa520; }
        
        .screen { display: none; }
        .active { display: block; animation: popIn 0.5s; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        input[type="text"] {
            padding: 15px; border-radius: 20px; border: 3px solid var(--secondary);
            font-size: 1.1em; width: 70%; text-align: center; outline: none;
        }
        .input-error { border-color: var(--error) !important; background-color: #fff0f0; }

        /* Note Styles */
        .note-content { text-align: left; background: #fff8e1; padding: 20px; border-radius: 15px; border: 2px dashed #f6e58d; margin-bottom: 20px; }
        .highlight { background: linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%); padding: 0 5px; border-radius: 3px; }

        /* Quiz Styles */
        .option-btn {
            background: white; border: 2px solid #eee; padding: 15px;
            border-radius: 15px; cursor: pointer; text-align: left; margin-bottom: 10px;
            width: 100%; box-sizing: border-box;
        }
        .option-btn.correct { background-color: #d4edda; border-color: #28a745; }
        .option-btn.wrong { background-color: #f8d7da; border-color: #dc3545; }
        
        .leaderboard-item {
            background: white; border-bottom: 2px dashed #eee; padding: 10px;
            display: flex; justify-content: space-between;
        }
        .rank-1 { color: gold; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen" class="screen active">
            <h1>社會學特訓班</h1>
            <div style="font-size: 3em;">🐹</div>
            <p>準備好面對 Sean 老師的挑戰了嗎？</p>
            <input type="text" id="username" placeholder="輸入你的暱稱 (必填)">
            <p id="name-error-msg" style="color: var(--error); display: none;">* 請輸入名稱！</p>
            <br><br>
            <button class="btn btn-start" onclick="startQuiz()">開始討伐！(Start)</button>
            <br>
            <button class="btn btn-note" onclick="showNotes()">📖 課程總結精華</button>
            <br>
            <button class="btn" onclick="showLeaderboard()">🏆 查看排行榜</button>
        </div>

        <div id="note-screen" class="screen">
            <h2>📜 課程總結精華</h2>
            <div class="note-content">
                <p><b>1. 社會學想像力：</b>將<span class="highlight">個人煩惱</span>連結到<span class="highlight">公共議題</span>。</p>
                <p><b>2. 三大理論：</b><br>功能論(穩定)、衝突論(鬥爭/不平等)、互動論(微觀/表演)。</p>
                <p><b>3. 偏差手段：</b>犯罪化(關)、醫療化(醫)、福利化(幫)、修復式(談)。</p>
            </div>
            <button class="btn" onclick="hideNotes()">我記住了！</button>
        </div>

        <div id="quiz-screen" class="screen">
            <div style="font-size: 1.5em; color: var(--primary); font-weight: bold;">⏱️ <span id="time-display">00:00</span></div>
            <div id="question-text" style="font-size: 1.2em; margin: 20px 0; font-weight: bold;">題目載入中...</div>
            <div id="options-container"></div>
            <div id="feedback-text" style="margin: 10px; font-weight: bold; min-height: 1.5em;"></div>
            <div style="display: flex; justify-content: space-between;">
                <button class="btn" style="width: 45%;" onclick="prevQuestion()">⬅️ 上一題</button>
                <button class="btn" style="width: 45%;" onclick="nextQuestion()">下一題 ➡️</button>
            </div>
            <button class="btn" style="background: #ffcccc; margin-top: 10px;" onclick="endQuizEarly()">提早交卷</button>
        </div>

        <div id="result-screen" class="screen">
            <h1>成績單</h1>
            <div style="font-size: 3em;" id="result-emoji">🐰</div>
            <h2 id="final-score">得分: 0 / 100</h2>
            <p id="time-taken">用時: 00:00</p>
            <button class="btn btn-start" id="upload-score-btn" onclick="uploadScore()">上傳分數</button>
            <button class="btn btn-retry" onclick="location.reload()">再做一次</button>
        </div>

        <div id="leaderboard-screen" class="screen">
            <h1>🏆 排行榜</h1>
            <ul style="list-style: none; padding: 0;" id="leaderboard-content"><li>載入中...</li></ul>
            <button class="btn" onclick="location.reload()">回首頁</button>
        </div>
    </div>

    <script>
        // --- Firebase 設定 (使用 Compat 寫法) ---
        const firebaseConfig = {
            apiKey: "AIzaSyCPIHCLEiaUGx5wPlAhAVy2ajBuGEQ39vU",
            authDomain: "soci-sem-1.firebaseapp.com",
            projectId: "soci-sem-1",
            storageBucket: "soci-sem-1.firebasestorage.app",
            messagingSenderId: "734898665192",
            appId: "1:734898665192:web:7c073eeb21f480d56cfb5d",
            measurementId: "G-J1GW0L4EQN"
        };
        
        // 初始化
        try {
            firebase.initializeApp(firebaseConfig);
            window.db = firebase.firestore();
            console.log("Firebase initialized successfully");
        } catch (e) {
            console.error("Firebase init error:", e);
            alert("Firebase 初始化失敗，請檢查網路連線。");
        }

        // --- 題目 (精簡版，可自行增加) ---
        const questions = [
            { q: "衝突論認為社會秩序如何維持？", options: ["共識合作", "優勢階級的強制", "符號互動", "宗教感化"], answer: 1, hint: "誰有權力？" },
            { q: "社會學想像力是將個人煩惱連結到？", options: ["心理問題", "公共議題與結構", "運氣", "基因"], answer: 1, hint: "看見大環境。" },
            { q: "接受目標(發財)但拒絕合法手段(不工作)，屬於墨頓哪一型？", options: ["順從", "儀式", "創新 (Innovation)", "退縮"], answer: 2, hint: "如小偷。" },
            { q: "將酗酒視為「生病」而非壞事，這是？", options: ["醫療化", "犯罪化", "福利化", "標籤化"], answer: 0, hint: "變醫學問題。" },
            { q: "「做性別」是指？", options: ["變性手術", "天生特質", "透過日常互動「表演」性別", "只在職場"], answer: 2, hint: "演男生或女生。" },
            { q: "馬克思認為工人會經歷什麼狀態？", options: ["社會化", "失範", "異化", "理性化"], answer: 2, hint: "變成機器。" },
            { q: "女性升遷遇到的隱形障礙叫？", options: ["玻璃天花板", "玻璃手扶梯", "黏地板", "隔離"], answer: 0, hint: "看得到上不去。" },
            { q: "職業婦女下班後做家務，稱為？", options: ["再生產", "第二輪班", "情緒勞動", "玻璃天花板"], answer: 1, hint: "下班後的班。" },
            { q: "衝突論如何看待家庭？", options: ["避風港", "性別不平等與剝削場所", "社會化場所", "維持穩定"], answer: 1, hint: "剝削無償勞動。" },
            { q: "修復式正義重點是？", options: ["嚴懲", "隔離", "修復關係與對話", "除罪"], answer: 2, hint: "對話與和解。" }
        ];

        let currentQuestionIndex = 0, score = 0, timerInterval, startTime;
        let userAnswers = new Array(questions.length).fill(null);

        function showNotes() { switchScreen('note-screen'); }
        function hideNotes() { switchScreen('start-screen'); }
        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startQuiz() {
            const username = document.getElementById("username").value.trim();
            if (!username) {
                document.getElementById("username").classList.add("input-error");
                document.getElementById("name-error-msg").style.display = "block";
                setTimeout(() => document.getElementById("username").classList.remove("input-error"), 400);
                return;
            }
            switchScreen('quiz-screen');
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
            loadQuestion();
        }

        function updateTimer() {
            const diff = Math.floor((Date.now() - startTime) / 1000);
            const m = Math.floor(diff / 60).toString().padStart(2, '0');
            const s = (diff % 60).toString().padStart(2, '0');
            document.getElementById("time-display").textContent = `${m}:${s}`;
        }

        function loadQuestion() {
            const qData = questions[currentQuestionIndex];
            document.getElementById("question-text").textContent = `${currentQuestionIndex + 1}. ${qData.q}`;
            document.getElementById("feedback-text").textContent = "";
            const container = document.getElementById("options-container");
            container.innerHTML = "";
            
            qData.options.forEach((opt, index) => {
                const btn = document.createElement("div");
                btn.className = "option-btn";
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(index, btn);
                if (userAnswers[currentQuestionIndex] !== null) {
                    if (index === qData.answer) btn.classList.add("correct");
                    else if (index === userAnswers[currentQuestionIndex]) btn.classList.add("wrong");
                }
                container.appendChild(btn);
            });
        }

        function checkAnswer(idx, btn) {
            const qData = questions[currentQuestionIndex];
            const feedback = document.getElementById("feedback-text");
            if (idx === qData.answer) {
                btn.classList.add("correct");
                feedback.textContent = "✨ 答對了！"; feedback.style.color = "green";
                if (userAnswers[currentQuestionIndex] === null) { userAnswers[currentQuestionIndex] = idx; score++; }
            } else {
                btn.classList.add("wrong");
                feedback.textContent = `😢 ${qData.hint}`; feedback.style.color = "red";
                if (userAnswers[currentQuestionIndex] === null) userAnswers[currentQuestionIndex] = idx;
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) { currentQuestionIndex++; loadQuestion(); }
            else endQuiz();
        }
        function prevQuestion() {
            if (currentQuestionIndex > 0) { currentQuestionIndex--; loadQuestion(); }
        }
        function endQuizEarly() { if(confirm("確定交卷？")) endQuiz(); }

        function endQuiz() {
            clearInterval(timerInterval);
            switchScreen('result-screen');
            document.getElementById("final-score").textContent = `得分: ${score} / ${questions.length}`;
            document.getElementById("time-taken").textContent = `用時: ${document.getElementById("time-display").textContent}`;
        }

        function uploadScore() {
            const btn = document.getElementById("upload-score-btn");
            btn.disabled = true; btn.textContent = "上傳中...";
            const timeStr = document.getElementById("time-display").textContent;
            const [m, s] = timeStr.split(":").map(Number);
            
            // 嘗試寫入，如果失敗 catch 會抓到
            window.db.collection("leaderboard").add({
                name: document.getElementById("username").value,
                score: score,
                time: timeStr,
                seconds: m * 60 + s,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("上傳成功！"); showLeaderboard();
            }).catch((e) => {
                console.error(e);
                alert("上傳失敗！\n請檢查：\n1. 網路是否連線\n2. Firebase 後台的 Rules 是否已設為 true (公開模式)");
                btn.disabled = false; btn.textContent = "重試上傳";
            });
        }

        function showLeaderboard() {
            switchScreen('leaderboard-screen');
            const list = document.getElementById("leaderboard-content");
            list.innerHTML = "<li>載入中...</li>";
            
            window.db.collection("leaderboard").orderBy("score", "desc").orderBy("seconds", "asc").limit(10).get()
            .then((snapshot) => {
                list.innerHTML = "";
                let i = 1;
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const li = document.createElement("li");
                    li.className = "leaderboard-item";
                    li.innerHTML = `<span class="${i<=3?'rank-'+i:''}">${i}. ${d.name}</span><span>${d.score}分 (${d.time})</span>`;
                    list.appendChild(li);
                    i++;
                });
                if(i===1) list.innerHTML = "<li>暫無數據，快來搶頭香！</li>";
            })
            .catch(e => {
                console.error(e);
                list.innerHTML = "<li style='color:red'>讀取失敗...請檢查 Firebase Rules 設定。</li>";
            });
        }
    </script>
</body>
</html>
