    <style>
        /* 吉伊卡哇風格 CSS */
        @import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap');

        :root {
            --primary: #ffcbda; /* Chiikawa Pink */
            --secondary: #aaddff; /* Hachiware Blue */
            --accent: #fffacd; /* Usagi Yellow */
            --text: #5a4d4d;
            --bg: #fffbf0;
        }

        body {
            font-family: 'Kosugi Maru', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle, #ffe4e1 2px, transparent 2.5px);
            background-size: 30px 30px;
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4);
            padding: 30px;
            text-align: center;
            border: 5px solid white;
            outline: 5px dashed var(--primary);
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: var(--primary);
            text-shadow: 2px 2px 0px var(--text);
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            font-family: inherit;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 5px 0 #77aadd;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        .btn-start { background-color: var(--primary); box-shadow: 0 5px 0 #ff99bb; }
        .btn-retry { background-color: var(--accent); color: #8B4513; box-shadow: 0 5px 0 #e6d980; }

        .screen { display: none; }
        .active { display: block; animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Input Styles */
        input[type="text"] {
            padding: 15px;
            border-radius: 20px;
            border: 3px solid var(--secondary);
            font-size: 1.1em;
            outline: none;
            width: 70%;
            text-align: center;
            color: var(--text);
        }

        /* Quiz Styles */
        .timer {
            font-size: 1.5em;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .question-card {
            background: #fdfdfd;
            border: 2px solid var(--secondary);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            font-size: 1.2em;
            line-height: 1.6;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: white;
            border: 2px solid #eee;
            padding: 15px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            font-size: 1em;
            color: var(--text);
        }

        .option-btn:hover {
            background-color: #f0f8ff;
            border-color: var(--secondary);
        }

        .option-btn.correct {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .option-btn.wrong {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .nav-btn {
            background: #ddd;
            border: none;
            padding: 10px 20px;
            border-radius: 15px;
            cursor: pointer;
            color: #666;
        }

        /* Leaderboard */
        .leaderboard-list {
            list-style: none;
            padding: 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .leaderboard-item {
            background: white;
            border-bottom: 2px dashed #eee;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rank-1 { color: gold; font-weight: bold; font-size: 1.2em; }
        .rank-2 { color: silver; font-weight: bold; }
        .rank-3 { color: #cd7f32; font-weight: bold; }

        .mascot {
            width: 100px;
            margin: 10px auto;
            display: block;
        }
        
        .feedback {
            margin-top: 10px;
            font-weight: bold;
            min-height: 1.5em;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background-color: #eee;
            border-radius: 10px;
            margin-bottom: 20px;
            height: 10px;
        }
        .progress-bar {
            height: 100%;
            background-color: var(--secondary);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s;
        }

    </style>
</head>

        // 啟動測驗

                return;

            document.getElementById("start-screen").classList.remove("active");
            document.getElementById("quiz-screen").classList.add("active");
            
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
            loadQuestion();

        // 計時器
        function updateTimer() {
            const now = Date.now();
            const diff = Math.floor((now - startTime) / 1000);
            const minutes = Math.floor(diff / 60).toString().padStart(2, '0');
            const seconds = (diff % 60).toString().padStart(2, '0');
            document.getElementById("time-display").textContent = `${minutes}:${seconds}`;
        }

            qData.options.forEach((opt, index) => {
                const btn = document.createElement("div");
                btn.className = "option-btn";
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(index, btn);
                
                // 如果已經答過，恢復狀態
                if (userAnswers[currentQuestionIndex] !== null) {
                    if (index === qData.answer) btn.classList.add("correct");
                    if (index === userAnswers[currentQuestionIndex] && index !== qData.answer) btn.classList.add("wrong");
                }
                
                optionsContainer.appendChild(btn);
            });
        }

        // 檢查答案
        function checkAnswer(selectedIndex, btnElement) {
            // 學習模式：如果還沒答對過，允許嘗試。但分數只計算第一次。
            const qData = questions[currentQuestionIndex];
            const feedback = document.getElementById("feedback-text");

            if (selectedIndex === qData.answer) {
                // 答對了
                btnElement.classList.add("correct");
                feedback.textContent = "✨ 答對了！好棒！(Ya-ha!)";
                feedback.style.color = "green";
                
                // 只有第一次作答才算分
                if (userAnswers[currentQuestionIndex] === null) {
                    userAnswers[currentQuestionIndex] = selectedIndex;
                    score++;
                }
                
                // 自動下一題? 不，讓用戶自己按，符合「選擇在錯的期間...」需求
            } else {
                // 答錯了
                btnElement.classList.add("wrong");
                feedback.textContent = `😢 哎呀... ${qData.hint || "再試一次！"}`;
                feedback.style.color = "red";
                
                // 記錄第一次錯誤
                if (userAnswers[currentQuestionIndex] === null) {
                    userAnswers[currentQuestionIndex] = selectedIndex; 
                }
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                endQuiz();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function endQuizEarly() {
            if(confirm("確定要提早交卷嗎？")) {
                endQuiz();
            }
        }

        function endQuiz() {
            clearInterval(timerInterval);
            document.getElementById("quiz-screen").classList.remove("active");
            document.getElementById("result-screen").classList.add("active");
            
            const finalScoreElement = document.getElementById("final-score");
            finalScoreElement.textContent = `得分: ${score} / ${questions.length}`;
            
            const timeStr = document.getElementById("time-display").textContent;
            document.getElementById("time-taken").textContent = `用時: ${timeStr}`;

            const comment = document.getElementById("result-comment");
            const emoji = document.getElementById("result-emoji");
            
            const percentage = (score / questions.length) * 100;
            if (percentage >= 90) {
                comment.textContent = "太強了！你是社會學大師！(Wai~!)";
                emoji.textContent = "🌟";
            } else if (percentage >= 60) {
                comment.textContent = "還不錯喔！繼續加油！";
                emoji.textContent = "😊";
            } else {
                comment.textContent = "不要氣餒，再溫習一下筆記吧！(哭)";
                emoji.textContent = "😭";
            }
        }

        // 上傳分數到 Firebase
        async function uploadScore() {
            const username = document.getElementById("username").value;
            const timeStr = document.getElementById("time-display").textContent;
            // 轉換時間為秒數以便排序
            const [mins, secs] = timeStr.split(":").map(Number);
            const totalSeconds = mins * 60 + secs;

            const btn = document.getElementById("upload-score-btn");
            btn.disabled = true;
            btn.textContent = "上傳中...";

            try {
                // 使用 window.addDoc 等全域變數
                await window.addDoc(window.collection(window.db, "leaderboard"), {
                    name: username,
                    score: score,
                    time: timeStr,
                    seconds: totalSeconds,
                    timestamp: new Date()
                });
                alert("上傳成功！");
                showLeaderboard();
            } catch (e) {
                console.error("Error adding document: ", e);
                alert("上傳失敗...請檢查網路或 Firebase 設定。\n(提示：請確保 Firestore 規則設為公開)");
                btn.disabled = false;
                btn.textContent = "重試上傳";
            }
        }

        // 顯示排行榜
        async function showLeaderboard() {
            document.getElementById("start-screen").classList.remove("active");
            document.getElementById("result-screen").classList.remove("active");
            document.getElementById("leaderboard-screen").classList.add("active");

            const list = document.getElementById("leaderboard-content");
            list.innerHTML = "<li>載入中... 🏃‍♂️</li>";

            try {
                // 查詢：分數高到低，時間少到多
                const q = window.query(
                    window.collection(window.db, "leaderboard"), 
                    window.orderBy("score", "desc"),
                    window.orderBy("seconds", "asc"),
                    window.limit(10)
                );

                const querySnapshot = await window.getDocs(q);
                list.innerHTML = "";
                
                let rank = 1;
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const li = document.createElement("li");
                    li.className = "leaderboard-item";
                    
                    let rankClass = "";
                    if(rank === 1) rankClass = "rank-1";
                    if(rank === 2) rankClass = "rank-2";
                    if(rank === 3) rankClass = "rank-3";

                    li.innerHTML = `
                        <span class="${rankClass}">#${rank} ${data.name}</span>
                        <span>${data.score}分 (${data.time})</span>
                    `;
                    list.appendChild(li);
                    rank++;
                });

                if (rank === 1) {
                    list.innerHTML = "<li>暫無數據，快來當第一名！</li>";
                }

            } catch (e) {
                console.error("Error getting documents: ", e);
                list.innerHTML = "<li>讀取失敗...請稍後再試。</li>";
            }
        }
    </script>
</body>
</html>
